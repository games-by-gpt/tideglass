<!doctype html><html><head><meta charset="UTF-8"><title>Tideglass art renderer</title><style>html,body{margin:0;overflow:hidden;background:#164b57}canvas{display:block}#title{position:absolute;color:#fff0c6;text-shadow:0 4px 30px #163f4933;pointer-events:none}#title b{font:400 100px Georgia,serif;letter-spacing:-5px;display:block}#title span{font:12px Arial,sans-serif;letter-spacing:7px;display:block;margin-top:18px;padding-left:6px}#shade{position:absolute;inset:0;background:linear-gradient(90deg,#0a354d99,transparent 70%);pointer-events:none}</style></head><body><canvas id="canvas"></canvas><div id="shade"></div><div id="title"><b>Tideglass</b><span>LIGHTHOUSE COURIER</span></div><script type="module">
import {World} from '/src/world.js';
const kind=new URLSearchParams(location.search).get('kind')||'cover';const world=new World(document.querySelector('canvas'));world.renderer.setPixelRatio(1);const level={color:0x258c9a,sky:0xc5decd,light:0xffe3a6,start:[3,10],goal:[2,-4],gems:[[-4,2],[9,4],[-8,-7]],rocks:[[-12,-4,3.8],[15,6,4],[-4,-17,3.2]],storms:[]};world.load(level);let fov=kind==='icon'?14:kind==='poster'?23:19,aspect=innerWidth/innerHeight;Object.assign(world.camera,{left:-fov*aspect,right:fov*aspect,top:fov,bottom:-fov});world.camera.updateProjectionMatrix();world.renderer.setSize(innerWidth,innerHeight);world.renderer.setClearColor(0x154b59);const title=document.querySelector('#title');if(kind==='icon'||kind==='splash'){title.style.display='none';document.querySelector('#shade').style.display='none';}else if(kind==='poster'){title.style.cssText='left:0;right:0;top:11%;text-align:center';title.querySelector('b').style.fontSize='120px';title.querySelector('span').style.fontSize='16px';}else{title.style.cssText='left:9%;top:41%';title.querySelector('b').style.fontSize=innerWidth*.087+'px';title.querySelector('span').style.fontSize=innerWidth*.012+'px';}
let t=0;const run={x:kind==='icon'?1:4,z:kind==='icon'?5:9,vx:0,vz:0,angle:-.5,collected:[],time:0,invulnerable:0};function render(){t+=1/60;world.update(1/60,t,run,'pause');const fx=kind==='icon'?2:kind==='poster'?2:-10,fz=kind==='poster'?-4:kind==='icon'?-2:-3;world.camera.position.set(fx,33,fz+38);world.camera.lookAt(fx,0,fz);world.beam.visible=true;world.lamp.material.color.setHex(0xffe5a0);world.renderer.render(world.scene,world.camera);requestAnimationFrame(render);}render();window.ready=true;
</script></body></html>
